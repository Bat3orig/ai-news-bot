name: AI News Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit state/ and data/
  pages: write      # deploy the site
  id-token: write   # required by deploy-pages

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}           # optional; defaults to https://<owner>.github.io/<repo>/
      AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}   # optional; see newsbot/ai.py
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1) fetch feeds, read article pages, translate to Mongolian, save data/articles, fill outbox
      - name: Prepare news
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_TOKEN }}
        run: python main.py prepare

      # 2) build + deploy the site before sending, so "Дэлгэрэнгүй" links already work
      - name: Build site
        run: python build_site.py

      - name: Upload site
        if: steps.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.prepare.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true   # the Telegram bot keeps working even if Pages isn't set up yet
        uses: actions/deploy-pages@v4

      # 3) send the outbox to Telegram (runs even if the site deploy failed)
      - name: Send to Telegram
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py send

      # Runs even if a step above failed, so already-sent items aren't sent twice.
      - name: Commit state and articles
        if: ${{ !cancelled() }}
        run: |
          git add state data
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: update news state [skip ci]"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
