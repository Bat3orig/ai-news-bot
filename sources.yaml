# Мэдээний эх сурвалжууд. Сэдвүүд нь topics.yaml-д тодорхойлогдсон.
#
# Талбарууд:
#   name              (заавал) Давхардахгүй нэр. Өөрчилбөл шинэ эх сурвалж гэж үзэж
#                     одоо байгаа мэдээг нь чимээгүй "харсан" гэж тэмдэглэнэ.
#   url               (заавал) RSS / Atom feed
#   type              rss | atom | github_release | google_news   (default: rss)
#   subtopic          topics.yaml-ийн дэд сэдвийн id. Заавал бол бүх мэдээ тэр дэд сэдэвт орно.
#                     Заагаагүй бол мэдээг topics.yaml-ийн keywords-оор ангилж, аль ч дэд
#                     сэдэвт таарахгүй мэдээг алгасна (Hacker News гэх мэт холимог эх сурвалж).
#   section           subtopic заагаагүй үед ангиллыг энэ сэдэв дотор хязгаарлана (ai | software | uiux)
#   keywords          Нэмэлт шүүлтүүр: гарчиг/товчлолд эдгээрийн аль нэг байх ёстой
#   skip_prereleases  true бол canary/alpha/beta/rc/nightly хувилбарыг алгасна
#   title_regex       Гарчиг энэ regex-тэй таарсан мэдээг л авна
#   enabled           false бол түр унтраана
#
# Google News: https://news.google.com/rss/search?q=<QUERY>&hl=en-US&gl=US&ceid=US:en

sources:
  # ======================= AI =======================
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    subtopic: openai

